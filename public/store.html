<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download the app</title>
  <meta name="description" content="Download the latest version of the app.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Roboto, Arial, sans-serif; color: #202124; background: #fff; }
    header { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid #e8eaed; color: #5f6368; font-size: 1.15rem; }
    header svg { width: 28px; height: 28px; }
    main { max-width: 960px; margin: 0 auto; padding: 28px 20px 60px; }
    .top { display: flex; gap: 24px; align-items: flex-start; }
    .icon { width: 96px; height: 96px; border-radius: 22px; object-fit: cover; box-shadow: 0 1px 3px rgba(0,0,0,.2); background: #e6f4ea; flex-shrink: 0; display: grid; place-items: center; font-size: 2.4rem; color: #137333; font-weight: 700; }
    h1 { font-size: 2rem; font-weight: 500; line-height: 1.2; }
    .dev { color: #01875f; font-weight: 500; margin-top: 6px; }
    .sub { color: #5f6368; font-size: .85rem; margin-top: 4px; }
    .stats { display: flex; margin: 24px 0; }
    .stat { padding: 0 24px; text-align: center; border-left: 1px solid #e8eaed; }
    .stat:first-child { padding-left: 0; border-left: none; }
    .stat b { display: block; font-weight: 500; }
    .stat span { color: #5f6368; font-size: .78rem; }
    .install { display: inline-block; background: #01875f; color: #fff; text-decoration: none; font-weight: 500; padding: 10px 0; width: 220px; text-align: center; border-radius: 8px; font-size: .95rem; }
    .install:hover { background: #056449; }
    .install.disabled { background: #dadce0; color: #80868b; pointer-events: none; }
    .note { color: #5f6368; font-size: .8rem; margin-top: 10px; }
    .shots { display: flex; gap: 12px; overflow-x: auto; margin: 32px 0; padding-bottom: 8px; }
    .shots img { height: 300px; border-radius: 12px; border: 1px solid #e8eaed; }
    h2 { font-size: 1.3rem; font-weight: 500; margin: 28px 0 12px; }
    .about { color: #3c4043; line-height: 1.6; white-space: pre-line; }
    .info { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-top: 12px; }
    .info div span { display: block; color: #5f6368; font-size: .8rem; }
    @media (max-width: 600px) { h1 { font-size: 1.5rem; } .icon { width: 72px; height: 72px; } .install { width: 100%; } .shots img { height: 220px; } }
  </style>
</head>
<body>
  <header>
    <svg viewBox="0 0 24 24"><path fill="#00a173" d="M3.6 2.2 13.4 12l-9.8 9.8c-.4-.2-.6-.6-.6-1.1V3.3c0-.5.2-.9.6-1.1z"/><path fill="#ffd400" d="m17 8.4-3.6 3.6L17 15.6l3.7-2.1c.9-.5.9-1.9 0-2.4z"/><path fill="#ff3333" d="M13.4 12 3.6 21.8c.4.2.9.2 1.3 0L17 15.6z"/><path fill="#48a0f8" d="M3.6 2.2 13.4 12 17 8.4 4.9 2.2c-.4-.2-.9-.2-1.3 0z"/></svg>
    <span>Google Play</span>
  </header>
  <main id="root"><p class="sub">Loading...</p></main>
  <script>
    const slug = location.pathname.split('/').filter(Boolean)[1] || 'primary';
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    fetch(`/api/public/store/${encodeURIComponent(slug)}`).then((r) => r.json()).then((d) => {
      if (d.error) throw new Error(d.error);
      document.title = `${d.appName} - Apps on Google Play`;
      const a = d.apk;
      document.getElementById('root').innerHTML = `
        <div class="top">
          ${d.icon ? `<img class="icon" src="${d.icon}" alt="">` : `<div class="icon">${esc(d.appName[0] || 'A')}</div>`}
          <div>
            <h1>${esc(d.appName)}</h1>
            <div class="dev">${esc(d.developer)}</div>
            <div class="sub">${esc(d.shortDescription)}</div>
          </div>
        </div>
        <div class="stats">
          <div class="stat"><b>${esc(d.rating)} ★</b><span>${esc(d.reviews)} reviews</span></div>
          <div class="stat"><b>${esc(d.downloads)}</b><span>Downloads</span></div>
          <div class="stat"><b>${esc(d.ageRating)}</b><span>Rated for ${esc(d.ageRating)}</span></div>
        </div>
        <a class="install ${a ? '' : 'disabled'}" href="${d.downloadUrl}">${a ? 'Install' : 'Coming soon'}</a>
        <p class="note">${a ? `Version ${esc(a.version || 'latest')} · ${esc(a.size)}` : 'No version available yet.'}</p>
        ${d.screenshots.length ? `<div class="shots">${d.screenshots.map((s) => `<img src="${s}" alt="">`).join('')}</div>` : ''}
        <h2>About this app</h2>
        <p class="about">${esc(d.description)}</p>
        ${a && a.notes ? `<h2>What's new</h2><p class="about">${esc(a.notes)}</p>` : ''}
        <h2>App info</h2>
        <div class="info">
          <div><span>Version</span>${esc(a ? a.version || 'Latest' : '-')}</div>
          <div><span>Updated on</span>${a ? new Date(a.uploadedAt).toLocaleDateString() : '-'}</div>
          <div><span>Category</span>${esc(d.category)}</div>
          <div><span>Offered by</span>${esc(d.developer)}</div>
        </div>`;
    }).catch(() => { document.getElementById('root').innerHTML = '<p class="sub">This app is not available.</p>'; });
  </script>
</body>
</html>
